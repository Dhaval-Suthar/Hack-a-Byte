<!-- Simple SVG icon for Network Neighborhood -->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .computer { fill: #c0c0c0; stroke: #000; stroke-width: 1; }
      .screen { fill: #000080; }
      .connection { stroke: #808080; stroke-width: 2; fill: none; }
    </style>
  </defs>
  
  <!-- Network connections -->
  <line class="connection" x1="8" y1="12" x2="24" y2="12" />
  <line class="connection" x1="16" y1="12" x2="16" y2="20" />
  
  <!-- Computer 1 -->
  <rect class="computer" x="2" y="8" width="12" height="8" />
  <rect class="screen" x="4" y="10" width="8" height="4" />
  
  <!-- Computer 2 -->
  <rect class="computer" x="18" y="8" width="12" height="8" />
  <rect class="screen" x="20" y="10" width="8" height="4" />
  
  <!-- Server -->
  <rect class="computer" x="12" y="20" width="8" height="10" />
  <rect class="screen" x="14" y="22" width="4" height="2" />
  <rect class="screen" x="14" y="25" width="4" height="2" />
  <rect class="screen" x="14" y="28" width="4" height="2" />
</svg>
