<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bagGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#404040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#202020;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="skullGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="180" height="180" rx="40" fill="url(#bgGradient)"/>
  
  <!-- Shopping bag outline -->
  <path d="M50 60 L130 60 L125 140 L55 140 Z" fill="url(#bagGradient)" stroke="#666666" stroke-width="2"/>
  
  <!-- Shopping bag handles -->
  <path d="M70 60 C70 45 80 35 90 35 C100 35 110 45 110 60" fill="none" stroke="#666666" stroke-width="3"/>
  
  <!-- Skull and crossbones -->
  <circle cx="90" cy="90" r="18" fill="url(#skullGradient)"/>
  <circle cx="84" cy="84" r="3" fill="#ffffff"/>
  <circle cx="96" cy="84" r="3" fill="#ffffff"/>
  <path d="M82 98 L98 98" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Crossbones -->
  <rect x="75" y="115" width="30" height="3" fill="#cc0000" transform="rotate(45 90 116.5)"/>
  <rect x="75" y="115" width="30" height="3" fill="#cc0000" transform="rotate(-45 90 116.5)"/>
  
  <!-- iOS-style highlight -->
  <rect x="0" y="0" width="180" height="40" rx="40" fill="url(#highlight)" opacity="0.3"/>
  <defs>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
</svg>
